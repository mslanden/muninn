<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muninn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="titlebar" data-tauri-drag-region>
        <!-- Pinned next to the traffic lights so they survive sidebar collapse -->
        <div class="titlebar-actions">
          <button class="head-btn" id="nav-settings" title="Settings" aria-label="Settings"></button>
          <button class="head-btn" id="sidebar-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
        </div>
      </div>

      <aside class="sidebar">
        <div class="sidebar-panel-wrap">
          <div id="sidebar-panels" class="sidebar-panels">
            <!-- Chat panel — the sidebar is chats-only; apps live in the footer rail -->
            <div class="sidebar-panel" data-panel="chat">
              <div class="sidebar-topline">
                <button class="new-chat-btn" id="new-chat-btn" title="New Chat">+ New Chat</button>
              </div>
              <div class="session-search">
                <input type="text" id="session-search-input" placeholder="Search chats…" autocomplete="off" spellcheck="false" />
              </div>
              <!-- Sessions and agents share one scroll area so no section pins dead space -->
              <div class="sidebar-scroll">
                <div id="session-list" class="session-list"></div>
                <div id="sidebar-agents-list" class="sidebar-agents-list"></div>
              </div>
            </div>
          </div>

          <!-- App launcher rail: one icon per app tile type -->
          <div class="sidebar-footer" id="sidebar-apps-rail"></div>
        </div>
      </aside>

      <div id="workspace" class="workspace"></div>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
