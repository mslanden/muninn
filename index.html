<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muninn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="titlebar" data-tauri-drag-region>
        <!-- Pinned next to the traffic lights so they survive sidebar collapse -->
        <div class="titlebar-actions">
          <button class="head-btn" id="sidebar-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
        </div>
      </div>

      <aside class="sidebar">
        <div class="sidebar-panel-wrap">
          <div id="sidebar-panels" class="sidebar-panels">
            <!-- Primary nav, then chats -->
            <div class="sidebar-panel" data-panel="chat">
              <nav class="sidebar-main-nav" aria-label="Main">
                <button class="nav-main-item" id="new-chat-btn" title="New chat"></button>
                <button class="nav-main-item" id="nav-tasks" title="Tasks"></button>
                <button class="nav-main-item" id="nav-library" title="Library"></button>
                <button class="nav-main-item" id="nav-connections" title="Connections"></button>
                <button class="nav-main-item" id="nav-settings" title="Settings"></button>
              </nav>
              <div class="session-search">
                <input type="text" id="session-search-input" placeholder="Search chats…" autocomplete="off" spellcheck="false" />
              </div>
              <div class="sidebar-scroll">
                <div id="session-list" class="session-list"></div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <div id="workspace" class="workspace"></div>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
