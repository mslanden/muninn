<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="titlebar" data-tauri-drag-region></div>

      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="sidebar-logo">SPINO</span>
          <span class="sidebar-version">v0.1</span>
        </div>

        <span class="sidebar-label">Workspace</span>
        <nav id="sidebar-nav" class="sidebar-nav"></nav>

        <span class="sidebar-label" style="margin-top: 12px;">Projects</span>
        <nav class="sidebar-nav">
          <button class="nav-item" id="nav-workspaces">
            <span class="nav-dot off"></span>
            Workspaces
          </button>
        </nav>

        <span class="sidebar-label" style="margin-top: 12px;">Quick Add</span>
        <nav class="sidebar-nav">
          <button class="nav-item" id="new-chat-btn">
            <span class="nav-dot off"></span>
            + New Chat
          </button>
        </nav>

        <div class="sidebar-spacer"></div>

        <nav class="sidebar-nav" style="margin-bottom: 8px;">
          <button class="nav-item" id="nav-settings">
            <span class="nav-dot off"></span>
            Settings
          </button>
        </nav>

        <div class="sidebar-footer">
          <span id="sidebar-workspace">~/</span>
          <span id="sidebar-model">connecting...</span>
        </div>
      </aside>

      <div id="workspace" class="workspace"></div>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
