<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muninn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="titlebar" data-tauri-drag-region></div>

      <aside class="sidebar">
        <!-- Persistent icon rail: tabs + settings + collapse -->
        <div class="sidebar-rail">
          <button class="rail-btn rail-brand" id="rail-brand" title="Muninn" aria-label="Muninn">
            <span class="rail-mark">M</span>
          </button>
          <div id="sidebar-tabs" class="sidebar-tabs"></div>
          <div class="rail-spacer"></div>
          <button class="rail-btn" id="nav-settings" title="Settings" aria-label="Settings">
            <span class="nav-dot off"></span>
          </button>
          <button class="rail-btn" id="sidebar-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
        </div>

        <!-- Expandable panel (sessions / apps) -->
        <div class="sidebar-panel-wrap">
          <div class="sidebar-brand">
            <span class="sidebar-logo">MUNINN</span>
            <span class="sidebar-version">v0.1</span>
          </div>

          <div id="sidebar-panels" class="sidebar-panels">
            <!-- Chat panel -->
            <div class="sidebar-panel" data-panel="chat">
              <div class="sidebar-nav" style="padding-top: 4px;">
                <button class="nav-item" id="new-chat-btn" title="New Chat">
                  <span class="nav-dot off"></span>
                  + New Chat
                </button>
              </div>
              <div class="session-search">
                <input type="text" id="session-search-input" placeholder="Search chats…" autocomplete="off" spellcheck="false" />
              </div>
              <div id="session-list" class="session-list"></div>
              <div class="sidebar-agents">
                <div class="sidebar-section-label">Agents</div>
                <div id="sidebar-agents-list" class="sidebar-agents-list"></div>
              </div>
            </div>

            <!-- Apps panel -->
            <div class="sidebar-panel" data-panel="apps" hidden>
              <nav id="sidebar-nav-apps" class="sidebar-nav" style="padding-top: 8px;"></nav>
            </div>
          </div>

          <div class="sidebar-footer">
            <button type="button" class="footer-switch" id="sidebar-workspace" title="Switch workspace">~/</button>
            <button type="button" class="footer-switch" id="sidebar-model" title="Switch model">connecting...</button>
          </div>
        </div>
      </aside>

      <div id="workspace" class="workspace"></div>

    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
