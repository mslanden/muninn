<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050507">
<title>Muninn</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='4'%20fill='%23050507'/%3E%3Ctext%20x='16'%20y='23'%20font-size='20'%20text-anchor='middle'%20fill='%23e0e0e4'%20font-family='monospace'%20font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<style>
  /* Muninn design tokens (dark) — from src/styles.css */
  :root {
    --bg: #050507;
    --card: #0c0c10;
    --surface: #0f0f14;
    --border: #1a1a22;
    --border-hover: #2a2a36;
    --text: #e0e0e4;
    --muted: #8e8ea2;
    --dim: #6e6e82;
    --accent: #b0b0c4;
    --live: #4ade80;
    --warn: #fbbf24;
    --blue: #60a5fa;
    --red: #ef4444;
    --purple: #a78bfa;
    --overlay-light: rgba(255,255,255,0.02);
    --overlay-medium: rgba(255,255,255,0.04);
    /* aliases kept so any stray reference stays coherent */
    --fg: var(--text);
    --fg-dim: var(--muted);
    --fg-dimmer: var(--dim);
    --green: var(--live);
    --yellow: var(--warn);
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    --sys: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F4F1EC;
      --card: #EBE7E0;
      --surface: #E3DFD7;
      --border: #D5D0C8;
      --border-hover: #C2BCB2;
      --text: #2C2A26;
      --muted: #6B6660;
      --dim: #908A82;
      --accent: #4A4640;
      --live: #5A8F5C;
      --warn: #B8923A;
      --blue: #4A7FAF;
      --red: #C0584E;
      --purple: #7E6DAF;
      --overlay-light: rgba(0,0,0,0.02);
      --overlay-medium: rgba(0,0,0,0.04);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(90,90,110,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(70,70,90,0.04) 0%, transparent 50%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--sys); font-size: 16px;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
  #app { height: 100%; display: flex; flex-direction: column; }
  .view { display: none; height: 100%; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }

  button {
    font-family: inherit; font-size: 16px; color: var(--text);
    background: var(--overlay-medium); border: 1px solid var(--border);
    border-radius: 4px; padding: 10px 14px; cursor: pointer;
    min-height: 44px; letter-spacing: .02em;
  }
  button:active { border-color: var(--border-hover); background: var(--surface); }
  button:disabled { opacity: .4; }
  .btn-primary { background: var(--overlay-medium); border-color: var(--border); color: var(--live); }
  .btn-primary:active { border-color: var(--live); }
  .btn-danger { background: var(--overlay-medium); border-color: var(--border); color: var(--red); }
  .btn-danger:active { border-color: var(--red); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  a { color: var(--blue); }
  code, pre { font-family: var(--mono); }

  /* brand wordmark */
  .brand-mark {
    display: flex; align-items: baseline; gap: 6px; flex: 1; min-width: 0;
  }
  .brand-mark .word {
    font-family: var(--mono); font-weight: 700; font-size: 13px;
    letter-spacing: 4px; color: var(--text); text-transform: uppercase;
  }
  .brand-mark .tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1px;
    color: var(--dim); text-transform: uppercase;
  }

  /* status dot — driven by #recon.show (reconnecting) */
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: var(--live); box-shadow: 0 0 6px rgba(74,222,128,.5);
  }
  #recon.show ~ #app .status-dot,
  body:has(#recon.show) .status-dot {
    background: var(--warn); box-shadow: 0 0 6px rgba(251,191,36,.5);
  }

  /* reconnect bar */
  #recon {
    display: none; position: fixed; top: 0; left: 0; right: 0;
    padding: calc(5px + var(--safe-t)) 8px 5px; text-align: center;
    background: var(--card); border-bottom: 1px solid var(--border);
    color: var(--warn); font-size: 9px; letter-spacing: 3px;
    text-transform: uppercase; z-index: 100;
  }
  #recon.show { display: block; }

  /* ===== headers (tile-header look) ===== */
  .topbar, .chat-header {
    display: flex; align-items: center; gap: 8px;
    min-height: 40px;
    padding-left: 12px; padding-right: 6px;
    padding-top: var(--safe-t);
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .chat-header { padding-left: 6px; }
  .chat-header .label {
    flex: 1; font-size: 9px; text-transform: uppercase; letter-spacing: 3px;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .icon-btn { min-width: 44px; min-height: 40px; padding: 8px; font-size: 18px; }

  /* ===== Sessions view ===== */
  #sessList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(20px + var(--safe-b)); }
  .sect-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 3px;
    color: var(--muted); padding: 16px 16px 8px;
  }
  .srow {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; display: flex; flex-direction: column; gap: 4px;
  }
  .srow:active { background: var(--overlay-medium); }
  .srow .title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .meta { font-size: 10px; color: var(--dim); display: flex; gap: 8px; letter-spacing: .04em; }
  .srow .pin { color: var(--warn); }
  .newchat-wrap { padding: 14px 16px calc(14px + var(--safe-b)); }
  #newChatBtn { width: 100%; text-transform: uppercase; letter-spacing: 2px; font-size: 11px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }

  /* ===== Chat view ===== */
  #goalBanner {
    display: none; align-items: center; gap: 8px;
    padding: 8px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border); color: var(--text); font-size: 12px;
  }
  #goalBanner.show { display: flex; }
  #transcript {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 18px;
    min-height: 0;
  }

  /* chat turns — open terminal-log aesthetic, no bubbles */
  .bubble {
    max-width: 100%; align-self: stretch;
    font-size: 13.5px; line-height: 1.7; color: var(--text);
    word-wrap: break-word; overflow-wrap: anywhere;
    padding-left: 10px; border-left: 1px solid var(--border);
  }
  .bubble::before {
    display: block; margin-bottom: 5px;
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 3px;
  }
  .bubble.user { border-left-color: var(--accent); }
  .bubble.user::before { content: "YOU"; color: var(--accent); }
  .bubble.assistant::before { content: "MUNINN"; color: var(--text); }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
    padding: 12px; overflow-x: auto; font-size: 11px; line-height: 1.6;
    color: var(--accent); margin: 8px 0;
  }
  .bubble code {
    background: var(--overlay-medium); border: 1px solid var(--border);
    border-radius: 2px; padding: 1px 5px; font-size: 0.9em;
  }
  .bubble pre code { background: none; border: none; padding: 0; }
  .bubble .cursor { display: inline-block; width: 7px; height: 14px; background: var(--live); animation: blink 1s steps(2) infinite; vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }

  .chip {
    align-self: flex-start; font-family: var(--mono); font-size: 11px;
    color: var(--muted); background: var(--overlay-medium); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 10px; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.done { color: var(--live); border-color: var(--border-hover); }
  .sysline { align-self: center; font-size: 11px; color: var(--dim); text-align: center; padding: 2px 8px; max-width: 100%; letter-spacing: .03em; }
  .sysline.goal { color: var(--live); }
  .sysline.err { color: var(--red); }

  .card {
    align-self: stretch; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px; font-size: 13px; display: flex; flex-direction: column; gap: 10px;
  }
  .card .q { color: var(--text); font-size: 13px; line-height: 1.5; }
  .card .cmd {
    font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--accent);
    background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
    padding: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  }
  .card .note { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
  .card .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .card .btns button { flex: 1; min-width: 100px; }
  .card .out {
    font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--accent);
    background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
    padding: 12px; overflow-x: auto; white-space: pre-wrap; max-height: 200px; overflow-y: auto;
  }
  .card input[type=text] {
    width: 100%; font-size: 16px; padding: 10px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono);
  }
  .card input[type=text]:focus { outline: none; border-color: var(--border-hover); }

  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 10px calc(8px + var(--safe-b));
    background: var(--card); border-top: 1px solid var(--border);
  }
  .composer textarea {
    flex: 1; resize: none; font-family: inherit; font-size: 16px;
    line-height: 1.4; padding: 11px 12px; border-radius: 4px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    max-height: 120px; overflow-y: auto;
  }
  .composer textarea:focus { outline: none; border-color: var(--border-hover); }
  .composer button { min-width: 44px; padding: 11px 14px; }
  .composer .attach-btn { font-size: 18px; }

  /* attachment preview strip (above composer) */
  .attach-strip {
    display: none; gap: 8px; padding: 8px 10px 0; overflow-x: auto;
    background: var(--card); border-top: 1px solid var(--border);
  }
  .attach-strip.show { display: flex; }
  .attach-thumb {
    position: relative; flex: none; width: 56px; height: 56px;
    border-radius: 4px; overflow: hidden; border: 1px solid var(--border);
    background: var(--bg);
  }
  .attach-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attach-thumb .rm {
    position: absolute; top: 1px; right: 1px; width: 18px; height: 18px;
    min-height: 0; padding: 0; border-radius: 50%; font-size: 11px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); border: 1px solid var(--border); color: var(--text);
  }

  /* images inside a chat turn */
  .bubble img.chat-img {
    display: block; max-width: 100%; border-radius: 6px;
    margin: 8px 0; border: 1px solid var(--border); cursor: zoom-in;
  }
  .sysline.shot { color: var(--muted); }

  /* fullscreen image overlay (tap to dismiss) */
  #imgOverlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.92); align-items: center; justify-content: center;
    padding: 20px;
  }
  #imgOverlay.show { display: flex; }
  #imgOverlay img { max-width: 100%; max-height: 100%; border-radius: 4px; }

  /* ===== No-token screen ===== */
  #noToken { align-items: center; justify-content: center; text-align: center; padding: 30px; gap: 16px; }
  #noToken .big { font-size: 44px; }
  #noToken h2 { margin: 0; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; font-size: 18px; }
  #noToken p { color: var(--muted); max-width: 320px; line-height: 1.6; font-size: 13px; }
</style>

<div id="recon">reconnecting…</div>
<div id="app">

  <!-- No token -->
  <div id="noToken" class="view">
    <div class="big">🔗</div>
    <h2>Muninn</h2>
    <p>Open <span style="color:var(--live)">Muninn → Settings</span> on your Mac and scan the QR code to pair this phone.</p>
  </div>

  <!-- Sessions -->
  <div id="sessionsView" class="view">
    <div class="topbar">
      <span class="brand-mark"><span class="word">MUNINN</span><span class="tag">MOBILE</span></span>
      <span class="status-dot" title="Connection"></span>
      <button class="icon-btn btn-ghost" id="refreshBtn" title="Refresh">⟳</button>
    </div>
    <div id="sessList"><div class="empty">Loading…</div></div>
    <div class="newchat-wrap">
      <button class="btn-primary" id="newChatBtn">+ New Chat</button>
    </div>

  <!-- Chat -->
  <div id="chatView" class="view">
    <div class="chat-header">
      <button class="icon-btn btn-ghost" id="backBtn">‹</button>

      <span class="status-dot" title="Connection"></span>
      <button class="icon-btn btn-ghost" id="chatRefreshBtn" title="Refresh">⟳</button>
    </div>
    <div id="goalBanner"></div>
    <div id="transcript"></div>
    <div class="attach-strip" id="attachStrip"></div>
    <div class="composer">
      <button class="btn-ghost attach-btn" id="attachBtn" title="Attach photo">📷</button>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      <textarea id="composerInput" rows="1" placeholder="Message… (/goal to set a goal)"></textarea>

      <button class="btn-primary" id="sendBtn">↑</button>
    </div>
  </div>

</div>

<div id="imgOverlay"><img alt=""></div>

<script>
"use strict";
(function () {
  // ---------- token / boot ----------
  var TOKEN_KEY = "muninn.mobile.token";
  var qToken = null;
  try {
    var params = new URLSearchParams(location.search);
    qToken = params.get("token");
  } catch (e) {}
  if (qToken) {
    try { localStorage.setItem(TOKEN_KEY, qToken); } catch (e) {}
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  }
  var TOKEN = null;
  try { TOKEN = localStorage.getItem(TOKEN_KEY); } catch (e) {}

  // ---------- helpers ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function showView(id) {
    var vs = document.querySelectorAll(".view");
    for (var i = 0; i < vs.length; i++) vs[i].classList.remove("active");
    $(id).classList.add("active");
  }
  function relTime(ts) {
    if (!ts) return "";
    var t;
    if (typeof ts === "number") {
      t = ts;
    } else {
      var s = String(ts);
      // SQLite CURRENT_TIMESTAMP is "YYYY-MM-DD HH:MM:SS" (UTC, space-separated) —
      // iOS Safari's Date.parse rejects that form, so normalize to ISO-8601 UTC.
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(s)) s = s.replace(" ", "T") + "Z";
      t = Date.parse(s);
    }
    if (isNaN(t)) return "";
    if (t < 1e12) t = t * 1000; // seconds -> ms
    var d = (Date.now() - t) / 1000;
    if (d < 0) d = 0;
    if (d < 60) return "just now";
    if (d < 3600) return Math.floor(d / 60) + "m";
    if (d < 86400) return Math.floor(d / 3600) + "h";
    if (d < 604800) return Math.floor(d / 86400) + "d";
    return new Date(t).toLocaleDateString();
  }

  // ---------- minimal markdown (escape FIRST) ----------
  function renderMarkdown(raw) {
    var s = esc(raw);
    var blocks = [];
    s = s.replace(/```([\s\S]*?)```/g, function (_, code) {
      var idx = blocks.length;
      blocks.push('<pre><code>' + code.replace(/^\n/, "") + '</code></pre>');
      return " B" + idx + " ";
    });
    var inline = [];
    s = s.replace(/`([^`\n]+)`/g, function (_, code) {
      var idx = inline.length;
      inline.push('<code>' + code + '</code>');
      return " I" + idx + " ";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    // links [text](url); url is already HTML-escaped so http:// is fine, guard scheme
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*)\)/g, function (_, txt, url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + txt + "</a>";
    });
    s = s.replace(/\n/g, "<br>");
    s = s.replace(/I(\d+)/g, function (_, i) { return inline[+i]; });
    s = s.replace(/B(\d+)/g, function (_, i) { return blocks[+i]; });
    return s;
  }

  // ---------- API ----------
  function api(method, path, body) {
    var opts = {
      method: method,
      headers: { "Authorization": "Bearer " + TOKEN }
    };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(path, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var ct = r.headers.get("content-type") || "";
      if (ct.indexOf("application/json") >= 0) return r.json();
      return r.text();
    });
  }

  // ---------- state ----------
  var currentSession = null;   // session id string
  var inFlight = false;        // is a turn running for currentSession
  var liveBubble = null;       // { el, text } for streaming
  var chipEls = {};            // tool_name -> chip element (best effort)
  var pendingAttachments = []; // [{ media_type, data (base64 no prefix) }]

  // ---------- image attachments ----------
  var MAX_ATTACHMENTS = 4;

  // Downscale/re-encode a File to a { media_type, data } attachment. Keeps small PNGs (likely
  // with transparency) as-is; everything else is re-encoded as JPEG at max dimension 1600px.
  function fileToAttachment(file) {
    return new Promise(function (resolve, reject) {
      var isPng = file.type === "image/png";
      if (isPng && file.size < 500 * 1024) {
        var r = new FileReader();
        r.onload = function () {
          var s = String(r.result || "");
          var comma = s.indexOf(",");
          resolve({ media_type: "image/png", data: comma >= 0 ? s.slice(comma + 1) : s });
        };
        r.onerror = function () { reject(new Error("read failed")); };
        r.readAsDataURL(file);
        return;
      }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var max = 1600;
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          var scale = Math.min(1, max / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          var dataUrl = canvas.toDataURL("image/jpeg", 0.8);
          URL.revokeObjectURL(url);
          var comma = dataUrl.indexOf(",");
          resolve({ media_type: "image/jpeg", data: comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl });
        } catch (e) {
          URL.revokeObjectURL(url);
          reject(e);
        }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode failed")); };
      img.src = url;
    });
  }

  function renderAttachStrip() {
    var strip = $("attachStrip");
    if (!pendingAttachments.length) {
      strip.classList.remove("show");
      strip.innerHTML = "";
      return;
    }
    strip.innerHTML = "";
    pendingAttachments.forEach(function (att, i) {
      var thumb = document.createElement("div");
      thumb.className = "attach-thumb";
      var im = document.createElement("img");
      im.src = "data:" + att.media_type + ";base64," + att.data;
      thumb.appendChild(im);
      var rm = document.createElement("button");
      rm.className = "rm";
      rm.textContent = "✕";
      rm.addEventListener("click", function () {
        pendingAttachments.splice(i, 1);
        renderAttachStrip();
      });
      thumb.appendChild(rm);
      strip.appendChild(thumb);
    });
    strip.classList.add("show");
  }

  function onFilesPicked(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length) return;
    var room = MAX_ATTACHMENTS - pendingAttachments.length;
    if (room <= 0) { alert("Up to " + MAX_ATTACHMENTS + " images per message."); return; }
    list = list.slice(0, room);
    Promise.all(list.map(function (f) {
      return fileToAttachment(f).catch(function () { return null; });
    })).then(function (atts) {
      atts.forEach(function (a) { if (a) pendingAttachments.push(a); });
      renderAttachStrip();
    });
  }

  // ---------- fullscreen image overlay ----------
  function openImageOverlay(src) {
    var ov = $("imgOverlay");
    ov.querySelector("img").src = src;
    ov.classList.add("show");
  }
  function closeImageOverlay() {
    var ov = $("imgOverlay");
    ov.classList.remove("show");
    ov.querySelector("img").src = "";
  }

  // Append an <img> (tap-to-zoom) into a bubble element.
  function appendImageToBubble(el, mediaType, data) {
    var src = "data:" + (mediaType || "image/png") + ";base64," + (data || "");
    var im = document.createElement("img");
    im.className = "chat-img";
    im.src = src;
    im.addEventListener("click", function () { openImageOverlay(src); });
    el.appendChild(im);
  }

  // Fetch a generated image (by content-dir path) via the authed /api/image endpoint and render
  // it as an assistant turn with the prompt as caption.
  function renderGeneratedImage(path, prompt) {
    if (!path) return;
    var t = $("transcript");
    var stick = nearBottom();
    var el = document.createElement("div");
    el.className = "bubble assistant";
    if (prompt) {
      var cap = document.createElement("div");
      cap.className = "sysline shot";
      cap.textContent = "🎨 " + prompt;
      el.appendChild(cap);
    }
    fetch("/api/image?path=" + encodeURIComponent(path), {
      headers: { "Authorization": "Bearer " + TOKEN }
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.blob();
    }).then(function (blob) {
      var src = URL.createObjectURL(blob);
      var im = document.createElement("img");
      im.className = "chat-img";
      im.src = src;
      im.addEventListener("click", function () { openImageOverlay(src); });
      el.appendChild(im);
      if (stick) scrollBottom();
    }).catch(function () {});
    t.appendChild(el);
    if (stick) scrollBottom();
  }

  // ============================================================
  // Sessions view
  // ============================================================
  function loadSessions() {
    var list = $("sessList");
    api("GET", "/api/sessions").then(function (sessions) {
      renderSessions(sessions || []);
    }).catch(function (e) {
      list.innerHTML = '<div class="empty">Failed to load sessions.<br><span style="font-size:12px">' + esc(e.message) + "</span></div>";
    });
  }

  function sessionLabel(s) {
    return s.title || s.preview || "New chat";
  }

  function renderSessions(sessions) {
    var list = $("sessList");
    if (!sessions.length) {
      list.innerHTML = '<div class="empty">No conversations yet.<br>Tap “+ New Chat” to begin.</div>';
      return;
    }
    var pinned = sessions.filter(function (s) { return s.pinned; });
    var recent = sessions.filter(function (s) { return !s.pinned; });
    var html = "";
    function rowHtml(s) {
      var lbl = sessionLabel(s);
      var count = (s.message_count != null) ? s.message_count : 0;
      return '<div class="srow" data-id="' + esc(s.id) + '">' +
        '<div class="title">' + (s.pinned ? '<span class="pin">★ </span>' : "") + esc(lbl) + "</div>" +
        '<div class="meta"><span>' + esc(relTime(s.last_message_at || s.created_at)) + "</span>" +
        '<span>· ' + count + ' msg</span></div></div>';
    }
    if (pinned.length) {
      html += '<div class="sect-label">Pinned</div>';
      html += pinned.map(rowHtml).join("");
    }
    if (recent.length) {
      html += '<div class="sect-label">Recent</div>';
      html += recent.map(rowHtml).join("");
    }
    list.innerHTML = html;
    var rows = list.querySelectorAll(".srow");
    for (var i = 0; i < rows.length; i++) {
      (function (row) {
        row.addEventListener("click", function () {
          openChat(row.getAttribute("data-id"), row.querySelector(".title").textContent);
        });
      })(rows[i]);
    }
  }

  function newChat() {
    api("POST", "/api/sessions", {}).then(function (s) {
      openChat(s.id, "New chat");
    }).catch(function (e) {
      alert("Could not create chat: " + e.message);
    });
  }

  // ============================================================
  // Chat view
  // ============================================================
  function openChat(id, label) {
    currentSession = String(id);
    inFlight = false;
    liveBubble = null;
    chipEls = {};
    pendingAttachments = [];
    renderAttachStrip();
    $("chatLabel").textContent = label || "Chat";
    $("transcript").innerHTML = "";
    $("goalBanner").classList.remove("show");
    $("goalBanner").textContent = "";
    setInFlight(false);
    showView("chatView");
    ensureWs();
    refreshChatData();
  }

  function refreshChatData() {
    var sid = currentSession;
    if (!sid) return;
    // messages
    api("GET", "/api/messages?session_id=" + encodeURIComponent(sid)).then(function (msgs) {
      if (sid !== currentSession) return;
      $("transcript").innerHTML = "";
      liveBubble = null;
      (msgs || []).forEach(function (m) {
        addMessageBubble(m.role, m.content, imageBlocksOf(m));
      });
      scrollBottom();
    }).catch(function (e) {
      if (sid !== currentSession) return;
      addSysLine("Failed to load messages: " + e.message, "err");
    });
    // goal
    api("GET", "/api/goal?session_id=" + encodeURIComponent(sid)).then(function (r) {
      if (sid !== currentSession) return;
      setGoalBanner(r && r.goal);
    }).catch(function () {});
    // deferred
    api("GET", "/api/deferred?session_id=" + encodeURIComponent(sid)).then(function (arr) {
      if (sid !== currentSession) return;
      (arr || []).forEach(function (d) {
        if (d.status && d.status !== "pending") return;
        addDeferredCard(d.id, d.command, d.verifier_note);
      });
      scrollBottom();
    }).catch(function () {});
  }

  function setGoalBanner(goal) {
    var b = $("goalBanner");
    if (goal) {
      b.textContent = "🎯 Goal: " + goal;
      b.classList.add("show");
    } else {
      b.textContent = "";
      b.classList.remove("show");
    }
  }

  function scrollBottom() {
    var t = $("transcript");
    requestAnimationFrame(function () { t.scrollTop = t.scrollHeight; });
  }
  function nearBottom() {
    var t = $("transcript");
    return (t.scrollHeight - t.scrollTop - t.clientHeight) < 120;
  }

  // Extract base64 image blocks from a message record's `blocks` array (Anthropic shape).
  function imageBlocksOf(m) {
    var out = [];
    var blocks = m && m.blocks;
    if (!Array.isArray(blocks)) return out;
    blocks.forEach(function (b) {
      if (b && b.type === "image" && b.source && b.source.type === "base64") {
        out.push({ media_type: b.source.media_type || "image/png", data: b.source.data || "" });
      }
    });
    return out;
  }

  function addMessageBubble(role, content, images) {
    var t = $("transcript");
    var el = document.createElement("div");
    el.className = "bubble " + (role === "user" ? "user" : "assistant");
    var textEl = document.createElement("div");
    if (role === "user") {
      textEl.innerHTML = esc(content).replace(/\n/g, "<br>");
    } else {
      textEl.innerHTML = renderMarkdown(content || "");
    }
    if (content != null && String(content).length) el.appendChild(textEl);
    if (images && images.length) {
      images.forEach(function (im) { appendImageToBubble(el, im.media_type, im.data); });
    }
    t.appendChild(el);
    return el;
  }

  function addSysLine(text, cls) {
    var t = $("transcript");
    var stick = nearBottom();
    var el = document.createElement("div");
    el.className = "sysline" + (cls ? " " + cls : "");
    el.textContent = text;
    t.appendChild(el);
    if (stick) scrollBottom();
  }

  // tool chips
  function toolChip(toolName, args) {
    var t = $("transcript");
    var stick = nearBottom();
    var el = document.createElement("div");
    el.className = "chip";
    var argStr = "";
    try {
      if (args && typeof args === "object") {
        var k = Object.keys(args)[0];
        if (k) argStr = " " + String(args[k]).slice(0, 40);
      } else if (typeof args === "string") {
        argStr = " " + args.slice(0, 40);
      }
    } catch (e) {}
    el.textContent = "🔧 " + (toolName || "tool") + argStr + "…";
    t.appendChild(el);
    if (stick) scrollBottom();
    return el;
  }

  // ---------- streaming live bubble ----------
  function ensureLiveBubble() {
    if (liveBubble) return liveBubble;
    var t = $("transcript");
    var el = document.createElement("div");
    el.className = "bubble assistant";
    el.innerHTML = '<span class="cursor"></span>';
    t.appendChild(el);
    liveBubble = { el: el, text: "" };
    return liveBubble;
  }
  function appendToken(tok) {
    var lb = ensureLiveBubble();
    lb.text += tok;
    var stick = nearBottom();
    lb.el.innerHTML = renderMarkdown(lb.text) + '<span class="cursor"></span>';
    if (stick) scrollBottom();
  }
  function finalizeBubble() {
    if (liveBubble) {
      liveBubble.el.innerHTML = renderMarkdown(liveBubble.text);
      liveBubble = null;
    }
    setInFlight(false);
  }

  // ---------- cards ----------
  function addQuestionCard(question, choices) {
    var t = $("transcript");
    var card = document.createElement("div");
    card.className = "card";
    card._qcard = true;
    var q = document.createElement("div");
    q.className = "q";
    q.textContent = question || "Muninn is asking for approval:";
    card.appendChild(q);

    function answer(ans) {
      api("POST", "/api/answer", { session_id: currentSession, answer: ans }).catch(function () {});
      card.remove();
      addSysLine("↳ answered: " + ans);
    }

    if (choices && choices.length) {
      var btns = document.createElement("div");
      btns.className = "btns";
      choices.forEach(function (c) {
        var b = document.createElement("button");
        b.className = "btn-primary";
        b.textContent = c;
        b.addEventListener("click", function () { answer(c); });
        btns.appendChild(b);
      });
      card.appendChild(btns);
    } else {
      var inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "Your answer…";
      card.appendChild(inp);
      var row = document.createElement("div");
      row.className = "btns";
      var send = document.createElement("button");
      send.className = "btn-primary";
      send.textContent = "Send";
      send.addEventListener("click", function () {
        if (inp.value.trim()) answer(inp.value.trim());
      });
      row.appendChild(send);
      card.appendChild(row);
    }
    t.appendChild(card);
    scrollBottom();
  }

  function removeQuestionCards() {
    var cards = $("transcript").querySelectorAll(".card");
    for (var i = 0; i < cards.length; i++) {
      if (cards[i]._qcard) cards[i].remove();
    }
  }

  function addDeferredCard(id, command, note) {
    var t = $("transcript");
    var card = document.createElement("div");
    card.className = "card";

    var q = document.createElement("div");
    q.className = "q";
    q.textContent = "⚠️ Command deferred for approval";
    card.appendChild(q);

    var cmd = document.createElement("div");
    cmd.className = "cmd";
    cmd.textContent = command || "";
    card.appendChild(cmd);

    if (note) {
      var n = document.createElement("div");
      n.className = "note";
      n.textContent = note;
      card.appendChild(n);
    }

    var btns = document.createElement("div");
    btns.className = "btns";
    var approve = document.createElement("button");
    approve.className = "btn-primary";
    approve.textContent = "Approve & run";
    var dismiss = document.createElement("button");
    dismiss.className = "btn-danger";
    dismiss.textContent = "Dismiss";
    btns.appendChild(approve);
    btns.appendChild(dismiss);
    card.appendChild(btns);

    approve.addEventListener("click", function () {
      approve.disabled = true; dismiss.disabled = true;
      approve.textContent = "Running…";
      api("POST", "/api/deferred/approve", { id: id }).then(function (r) {
        approve.textContent = "Ran ✓";
        var out = document.createElement("div");
        out.className = "out";
        out.textContent = (r && r.output != null) ? String(r.output) : "(no output)";
        card.appendChild(out);
        scrollBottom();
      }).catch(function (e) {
        approve.textContent = "Failed";
        var out = document.createElement("div");
        out.className = "out";
        out.textContent = "Error: " + e.message;
        card.appendChild(out);
      });
    });
    dismiss.addEventListener("click", function () {
      approve.disabled = true; dismiss.disabled = true;
      api("POST", "/api/deferred/dismiss", { id: id }).catch(function () {});
      dismiss.textContent = "Dismissed";
    });

    t.appendChild(card);
    scrollBottom();
  }

  // ---------- send / stop ----------
  function setInFlight(v) {
    inFlight = v;
    $("stopBtn").style.display = v ? "" : "none";
    $("sendBtn").disabled = v;
  }

  function sendMessage() {
    var ta = $("composerInput");
    var text = ta.value.trim();
    if (!currentSession) return;
    if (!text && !pendingAttachments.length) return;

    // /goal handling (text-only; images are ignored for these commands)
    if (text === "/goal") {
      api("GET", "/api/goal?session_id=" + encodeURIComponent(currentSession)).then(function (r) {
        addSysLine(r && r.goal ? "Current goal: " + r.goal : "No goal set.");
      }).catch(function () { addSysLine("No goal set."); });
      ta.value = ""; autogrow();
      return;
    }
    if (text === "/goal clear") {
      api("POST", "/api/goal", { session_id: currentSession, goal: "" }).then(function () {
        setGoalBanner(null);
        addSysLine("Goal cleared.");
      }).catch(function (e) { addSysLine("Failed to clear goal: " + e.message, "err"); });
      ta.value = ""; autogrow();
      return;
    }
    if (text.indexOf("/goal ") === 0) {
      var goalText = text.slice(6).trim();
      api("POST", "/api/goal", { session_id: currentSession, goal: goalText }).then(function () {
        setGoalBanner(goalText);
      }).catch(function () {});
      var kickoff = "Work toward this goal until it is fully met: " + goalText;
      ta.value = ""; autogrow();
      dispatchChat(kickoff);
      return;
    }

    var atts = pendingAttachments.slice();
    pendingAttachments = [];
    renderAttachStrip();
    ta.value = ""; autogrow();
    dispatchChat(text, atts);
  }

  function dispatchChat(message, attachments) {
    var atts = attachments || [];
    addMessageBubble("user", message, atts);
    scrollBottom();
    setInFlight(true);
    var sid = currentSession;
    var body = { session_id: sid, message: message };
    if (atts.length) body.attachments = atts;
    api("POST", "/api/chat", body).then(function (r) {
      if (sid !== currentSession) return;
      // Final confirmation. If streaming produced a live bubble it is finalized
      // by chat-done; otherwise render the reply now.
      if (liveBubble) {
        finalizeBubble();
      } else if (r && r.reply != null && String(r.reply).length) {
        addMessageBubble("assistant", String(r.reply));
        setInFlight(false);
        scrollBottom();
      } else {
        setInFlight(false);
      }
    }).catch(function (e) {
      if (sid !== currentSession) return;
      finalizeBubble();
      addSysLine("Request failed: " + e.message, "err");
      setInFlight(false);
    });
  }

  function stopChat() {
    if (!currentSession) return;
    api("POST", "/api/stop", { session_id: currentSession }).catch(function () {});
    finalizeBubble();
    addSysLine("Stopped.");
  }

  // ---------- composer autogrow ----------
  function autogrow() {
    var ta = $("composerInput");
    ta.style.height = "auto";
    var max = 120;
    ta.style.height = Math.min(ta.scrollHeight, max) + "px";
  }

  // ============================================================
  // WebSocket
  // ============================================================
  var ws = null;
  var wsBackoff = 1000;
  var wsWasDown = false;
  var wsConnecting = false;

  function wsUrl() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    return proto + "//" + location.host + "/ws?token=" + encodeURIComponent(TOKEN);
  }

  function ensureWs() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    connectWs();
  }

  function connectWs() {
    if (wsConnecting) return;
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    wsConnecting = true;
    var sock;
    try {
      sock = new WebSocket(wsUrl());
    } catch (e) {
      wsConnecting = false;
      scheduleReconnect();
      return;
    }
    ws = sock;
    sock.onopen = function () {
      wsConnecting = false;
      wsBackoff = 1000;
      hideRecon();
      if (wsWasDown) {
        wsWasDown = false;
        if (currentSession && $("chatView").classList.contains("active")) {
          refreshChatData();
        }
      }
    };
    sock.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      handleWsEvent(msg);
    };
    sock.onclose = function () {
      wsConnecting = false;
      showRecon();
      scheduleReconnect();
    };
    sock.onerror = function () {
      try { sock.close(); } catch (e) {}
    };
  }

  function scheduleReconnect() {
    wsWasDown = true;
    var delay = wsBackoff;
    wsBackoff = Math.min(wsBackoff * 2, 30000);
    setTimeout(connectWs, delay);
  }

  function showRecon() { $("recon").classList.add("show"); }
  function hideRecon() { $("recon").classList.remove("show"); }

  function handleWsEvent(msg) {
    var name = msg && msg.event;
    var p = (msg && msg.payload) || {};
    if (!name) return;
    var sid = p.session_id != null ? String(p.session_id) : null;

    // Only affect the transcript while the chat view is open.
    if (!$("chatView").classList.contains("active")) return;

    // Filter to the open session. Events with no session_id (e.g. todos-changed)
    // are treated as global.
    var forThis = (sid == null) || (currentSession != null && sid === currentSession);
    if (!forThis) return;

    switch (name) {
      case "chat-token":
        setInFlight(true);
        appendToken(p.token != null ? String(p.token) : "");
        break;
      case "chat-done":
        finalizeBubble();
        break;
      case "tool-start": {
        var chip = toolChip(p.tool_name, p.arguments);
        if (p.tool_name) chipEls[p.tool_name] = chip;
        break;
      }
      case "tool-complete": {
        var el = p.tool_name ? chipEls[p.tool_name] : null;
        if (el) {
          el.className = "chip done";
          var status = p.status ? " (" + p.status + ")" : "";
          el.textContent = "✓ " + (p.tool_name || "tool") + status;
          delete chipEls[p.tool_name];
        }
        break;
      }
      case "agent-iteration":
        addSysLine("· " + (p.agent_name || "agent") + " · step " + (p.iteration != null ? p.iteration : "?"));
        break;
      case "goal-iteration":
        if (p.reason) addSysLine("🎯 checking goal: " + p.reason);
        break;
      case "goal-met":
        setGoalBanner(null);
        addSysLine("🎯 Goal met: " + (p.reason || ""), "goal");
        break;
      case "user-question":
        addQuestionCard(p.question, p.choices);
        break;
      case "user-question-timeout":
        removeQuestionCards();
        addSysLine("question timed out — command deferred");
        break;
      case "command-deferred":
        addDeferredCard(p.id, p.command, p.verifier_note);
        break;
      case "screen-captured": {
        // Finalize any streaming bubble, then show the screenshot as an assistant turn.
        if (liveBubble) { liveBubble.el.innerHTML = renderMarkdown(liveBubble.text); liveBubble = null; }
        var stick = nearBottom();
        var shot = document.createElement("div");
        shot.className = "bubble assistant";
        var lbl = document.createElement("div");
        lbl.className = "sysline shot";
        lbl.textContent = "📸 " + (p.note || "screenshot");
        shot.appendChild(lbl);
        appendImageToBubble(shot, p.media_type, p.data);
        $("transcript").appendChild(shot);
        if (stick) scrollBottom();
        break;
      }
      case "image-generated": {
        // Payload carries only a filesystem path into the content dir; fetch + render it.
        if (liveBubble) { liveBubble.el.innerHTML = renderMarkdown(liveBubble.text); liveBubble = null; }
        renderGeneratedImage(p.path, p.prompt);
        break;
      }
      case "todos-changed":
        // low priority — ignore
        break;
      default:
        break;
    }
  }

  // ============================================================
  // Wiring
  // ============================================================
  function init() {
    if (!TOKEN) {
      showView("noToken");
      return;
    }
    // sessions
    $("refreshBtn").addEventListener("click", loadSessions);
    $("newChatBtn").addEventListener("click", newChat);
    // chat
    $("backBtn").addEventListener("click", function () {
      currentSession = null;
      showView("sessionsView");
      loadSessions();
    });
    $("chatRefreshBtn").addEventListener("click", refreshChatData);
    $("sendBtn").addEventListener("click", sendMessage);
    $("stopBtn").addEventListener("click", stopChat);
    // attachments
    $("attachBtn").addEventListener("click", function () { $("fileInput").click(); });
    $("fileInput").addEventListener("change", function () {
      onFilesPicked(this.files);
      this.value = ""; // allow re-picking the same file
    });
    $("imgOverlay").addEventListener("click", closeImageOverlay);
    var ta = $("composerInput");
    ta.addEventListener("input", autogrow);
    ta.addEventListener("keydown", function (e) {
      // Hardware-keyboard convenience: Enter sends, Shift+Enter = newline.
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });

    showView("sessionsView");
    loadSessions();
    ensureWs();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
